name: Swift

env:
  SDK_BRANCH_NAME: ${{ inputs.sdk_branch  || github.head_ref || github.ref_name }}
  TEST_DATA_BRANCH_NAME: ${{ inputs.test_data_branch || 'main' }}

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

  workflow_call:
    inputs:
      test_data_branch:
        type: string
        description: The branch in sdk-test-data to target for testcase files
        required: false
        default: main
      sdk_branch:
        type: string
        description: The branch of the SDK to test
        required: false

jobs:
  lint:
    runs-on: macos-latest
    steps:
      # This repository, not Eppo-exp/eppo-ios-sdk, so pull requests test their own code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sdk_branch }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: make lint

  build:
    runs-on: macos-latest
    steps:
      - name: Display Testing Details
        run: |
          echo "Running SDK Test using"
          echo "Test Data: sdk-test-data@${TEST_DATA_BRANCH_NAME}"
          echo "SDK Branch: eppo-ios-sdk@${SDK_BRANCH_NAME}"

      # This repository, not Eppo-exp/eppo-ios-sdk, so pull requests test their own code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sdk_branch }}

      - name: Build
        run: make build

      - name: Pull test data
        run: make test-data branchName=${{env.TEST_DATA_BRANCH_NAME}}

      - name: Run tests
        run: make test
